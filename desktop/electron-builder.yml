# electron-builder config for AirBridge Pro (Systems-owned).
#   npm run build:backend   # per OS/arch: ../airbridge/build_backend.sh (or .ps1)
#   npm run dist
appId: app.airbridge.pro
productName: AirBridge Pro
copyright: Copyright (c) 2026 AirBridge
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
asar: true
# The daemon binary for THIS build's platform/arch only, at
# <resources>/bin/<process.platform>-<process.arch>/airbridge-core[.exe]
# (matches mcpConfig.packagedCorePath and build_backend.sh/.ps1 output dirs).
extraResources:
  - from: resources/bin/${platform}-${arch}
    to: bin/${platform}-${arch}
    filter:
      - airbridge-core
      - airbridge-core.exe
  # Phase 3 §9: the airbridge-net private-network sidecar (embedded tsnet; desktop/scripts/build-net.sh
  # / .ps1), at <resources>/net/<platform>-<arch>/ (index.ts netBinDir), plus license notices.
  - from: resources/net/${platform}-${arch}
    to: net/${platform}-${arch}
    filter:
      - airbridge-net
      - airbridge-net.exe
      - manifest.json
  - from: resources/licenses
    to: licenses
    filter:
      - "*LICENSE*"
protocols:
  - name: AirBridge
    schemes:
      - airbridge
# Hardening (airbridge/docs/PHASE2_SECURITY.md section 5). Native electron-builder >= 25 support.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  loadBrowserProcessSpecificV8Snapshot: false
  # grantFileProtocolExtraPrivileges stays at the default: the production renderer is loaded
  # from file:// (see PHASE2_SECURITY.md section 5 note).
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # airbridge-core and airbridge-net (Contents/Resources/{bin,net}/darwin-<arch>/) are signed with the
  # app identity (hardened runtime, same entitlements) because @electron/osx-sign walks all of
  # Contents/ and signs every Mach-O it finds. Do NOT list them in mac.binaries: electron-builder
  # expands "-${arch}" there to "" for single-arch builds (bin/darwin/airbridge-core), and codesign
  # then fails with "No such file or directory". CI checks both binaries' signatures after packaging.
  # Signing/notarization happen in CI (CSC_LINK / APPLE_ID env); unsigned locally.
  notarize: false
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Development
npmRebuild: false
publish: null

# AirBridge Headscale stack: headscale v0.29.7 + Caddy (automatic TLS) + the license server.
# The Headscale REST API is reachable ONLY on the internal `control` network (license server -> headscale);
# Caddy returns 404 for /api/* and /swagger* on the public site. See README.md.
# Required env in ./.env: HEADSCALE_DOMAIN, ACME_EMAIL. License-server secrets in ./license-server.env.
name: airbridge-headscale

services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.7
    restart: unless-stopped
    command: serve
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ./config/config.yaml:/etc/headscale/config.yaml:ro
      - ./policy.hujson:/etc/headscale/policy.hujson:ro
      - ./data:/var/lib/headscale
    ports:
      # STUN for the embedded DERP relay (the only port published by headscale itself).
      - "3478:3478/udp"
    networks:
      edge: {}
      control: {}
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: docker.io/library/caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - headscale
    ports:
      - "80:80"
      - "443:443"
    environment:
      HEADSCALE_DOMAIN: ${HEADSCALE_DOMAIN:?set HEADSCALE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge: {}

  # License server co-located with Headscale so the admin API never leaves the host.
  # Expose it publicly via your own reverse proxy / a second Caddy site, or keep using a separate deployment
  # that reaches headscale over a private network (WireGuard/VPC) — never over the public listener.
  license-server:
    build: ..
    restart: unless-stopped
    env_file: ./license-server.env
    environment:
      HEADSCALE_URL: http://headscale:8080
      HEADSCALE_PUBLIC_URL: https://${HEADSCALE_DOMAIN:?set HEADSCALE_DOMAIN}
    depends_on:
      - headscale
    ports:
      # Loopback only. Put it behind TLS (e.g. a second Caddy site, see README) before exposing it.
      - "127.0.0.1:8787:8787"
    networks:
      control: {}
      # Outbound internet (Stripe, Clerk JWKS). `control` is internal and has no egress.
      egress: {}

networks:
  edge:
    ipam:
      config:
        # Must match trusted_proxies in config.yaml.tmpl.
        - subnet: 172.30.53.0/24
  control:
    # Internal-only: license server <-> headscale API. No external access, no egress.
    internal: true
  egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}

# Unsigned AirBridge Pro test installers for macOS (arm64 + x64) and Windows (x64).
# Each runner builds its own airbridge-core (PyInstaller cannot cross-compile) and airbridge-net,
# then packages the app with desktop/electron-builder.unsigned.yml. The public build config in
# desktop/.env.production is baked in by `electron-vite build` (production mode).
# On a push to the branch, the `publish` job uploads the three installers to our server (GitHub Actions OIDC, no
# stored secret; license-server/src/releases.ts) and makes them the latest download on the landing page.
name: desktop-build

on:
  push:
    branches: [claude/airbridge-p2p-network-ha3opt]
    paths:
      - "desktop/**"
      - "airbridge/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: airbridge-mac-arm64
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            artifact: airbridge-mac-x64
            platform: darwin
            arch: x64
          - os: windows-latest
            artifact: airbridge-win-x64
            platform: win32
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GOTOOLCHAIN: auto
      PLAT_DIR: ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            airbridge/requirements.txt
            airbridge/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/sidecar/airbridge-net/go.mod
          cache-dependency-path: desktop/sidecar/airbridge-net/go.sum

      - name: Check runner arch
        shell: bash
        run: |
          echo "runner: $(uname -s) $(uname -m); want ${{ matrix.platform }}-${{ matrix.arch }}"
          node -e "const want='${{ matrix.platform }}-${{ matrix.arch }}', got=process.platform+'-'+process.arch; if (got!==want) { console.error('node is '+got+', expected '+want); process.exit(1) }"

      # airbridge-core (PyInstaller) + airbridge-net (Go sidecar, S-1 DNS-fallback guard)
      - name: Build backend (macOS)
        if: runner.os == 'macOS'
        env:
          PYTHON: python
        run: |
          bash airbridge/build_backend.sh
          bash desktop/scripts/build-net.sh

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHON: python
        run: |
          ./airbridge/build_backend.ps1
          ./desktop/scripts/build-net.ps1

      - name: Smoke test backend binaries
        shell: bash
        run: |
          set -euo pipefail
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          core="desktop/resources/bin/$PLAT_DIR/airbridge-core$ext"
          net="desktop/resources/net/$PLAT_DIR/airbridge-net$ext"
          ls -l "$core" "$net"
          file "$core" "$net" || true
          export AIRBRIDGE_DATA_DIR="$RUNNER_TEMP/abdata" AIRBRIDGE_LOG_FILE="$RUNNER_TEMP/ab.log"
          "$core" --help 2>&1 | tee "$RUNNER_TEMP/core-help.txt"
          grep -q -- "--daemon" "$RUNNER_TEMP/core-help.txt"
          # airbridge-net has no flags: it reads one JSON config line on stdin and exits 2 without it.
          set +e; "$net" </dev/null 2>"$RUNNER_TEMP/net.err"; rc=$?; set -e
          cat "$RUNNER_TEMP/net.err"
          [ "$rc" -eq 2 ] && grep -q "missing configuration on stdin" "$RUNNER_TEMP/net.err"
          cat "desktop/resources/net/$PLAT_DIR/manifest.json"

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: electron-vite build (production config from .env.production)
        working-directory: desktop
        shell: bash
        run: |
          npx electron-vite build
          url="$(grep '^MAIN_VITE_AIRBRIDGE_LICENSE_URL=' .env.production | cut -d= -f2-)"
          grep -q "$url" out/main/index.js || { echo "production config not baked into out/main" >&2; exit 1; }

      - name: Package (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npx electron-builder --config electron-builder.unsigned.yml --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Package (Windows, unsigned)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx electron-builder --config electron-builder.unsigned.yml --win nsis --x64 --publish never

      - name: Verify packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls -d desktop/release/mac*/*.app | head -1)"
          echo "app: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          res="$app/Contents/Resources"
          for b in "$res/bin/$PLAT_DIR/airbridge-core" "$res/net/$PLAT_DIR/airbridge-net"; do
            codesign -dv "$b" 2>&1 | grep -E "Signature|Identifier|Format"
            codesign --verify --strict "$b"
          done
          for b in "$app/Contents/MacOS/"* "$res/bin/$PLAT_DIR/airbridge-core" "$res/net/$PLAT_DIR/airbridge-net"; do
            echo "$(lipo -archs "$b") $b"
          done
          export AIRBRIDGE_DATA_DIR="$RUNNER_TEMP/abdata2" AIRBRIDGE_LOG_FILE="$RUNNER_TEMP/ab2.log"
          "$res/bin/$PLAT_DIR/airbridge-core" --help 2>&1 | grep -q -- "--daemon"
          set +e; "$res/net/$PLAT_DIR/airbridge-net" </dev/null 2>/dev/null; rc=$?; set -e
          [ "$rc" -eq 2 ]
          ls "$res/licenses"
          npx --prefix desktop @electron/fuses read --app "$app" || true
          ls -l desktop/release

      - name: Verify packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          res="desktop/release/win-unpacked/resources"
          export AIRBRIDGE_DATA_DIR="$RUNNER_TEMP/abdata2" AIRBRIDGE_LOG_FILE="$RUNNER_TEMP/ab2.log"
          "$res/bin/$PLAT_DIR/airbridge-core.exe" --help 2>&1 | grep -q -- "--daemon"
          set +e; "$res/net/$PLAT_DIR/airbridge-net.exe" </dev/null 2>/dev/null; rc=$?; set -e
          [ "$rc" -eq 2 ]
          ls "$res/licenses"
          ls -l desktop/release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe

  publish:
    name: publish to the download server
    needs: build
    if: github.ref == 'refs/heads/claude/airbridge-p2p-network-ha3opt' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Long only on a server that does not have the upload route yet (first deploy): it waits for it (below).
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # GitHub-signed OIDC token: the server checks repository, branch and this workflow file
    env:
      SERVER: https://167-99-125-208.sslip.io
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the installers under their public names
        id: files
        shell: bash
        run: |
          set -euo pipefail
          ver="$(jq -r .version desktop/package.json)"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-][0-9A-Za-z.]+)?$ ]] || { echo "bad version $ver" >&2; exit 1; }
          mkdir -p out
          pick() { # source name, public name
            local src
            src="$(find artifacts -type f -name "$1" | head -1)"
            [ -n "$src" ] || { echo "missing artifact: $1" >&2; ls -lR artifacts >&2; exit 1; }
            cp "$src" "out/$2"
          }
          pick "AirBridge Pro-$ver-arm64.dmg" "AirBridge-Pro-$ver-mac-arm64.dmg"
          pick "AirBridge Pro-$ver.dmg" "AirBridge-Pro-$ver-mac-x64.dmg"
          pick "AirBridge Pro Setup $ver.exe" "AirBridge-Pro-$ver-win-x64.exe"
          (cd out && sha256sum * | tee ../SHA256SUMS && ls -l)
          echo "version=$ver" >>"$GITHUB_OUTPUT"

      - name: Wait for the server (upload route, no deploy in progress)
        shell: bash
        run: |
          set -uo pipefail
          for i in $(seq 1 300); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SERVER/v1/releases/upload")"
            state="$(curl -fsS "$SERVER/v1/deploy/status" 2>/dev/null | jq -r '.state // empty' 2>/dev/null)"
            if [ "$code" = 401 ] && [ "$state" != deploying ]; then echo "server ready"; exit 0; fi
            if [ $((i % 10)) = 1 ]; then
              echo "waiting: upload route answers $code (401 = ready), deploy state '${state:-n/a}'."
              [ "$code" = 404 ] && echo "  The server has no upload route yet: deploy this commit once from the DigitalOcean console: sudo airbridge-update $GITHUB_SHA"
            fi
            sleep 30
          done
          echo "server not ready after 150 minutes" >&2
          exit 1

      - name: Upload and publish
        shell: bash
        env:
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          token() {
            local t
            t="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=airbridge-releases" | jq -r .value)"
            echo "::add-mask::$t"
            printf '%s' "$t"
          }
          for f in out/*; do
            name="$(basename "$f")"
            want="$(sha256sum "$f" | cut -d' ' -f1)"
            for attempt in 1 2 3; do
              tok="$(token)"
              if curl -sS --fail-with-body -o resp.json -X POST -T "$f" \
                   -H "Authorization: Bearer $tok" -H 'Content-Type: application/octet-stream' \
                   "$SERVER/v1/releases/upload?name=$name"; then
                got="$(jq -r .sha256 resp.json)"
                [ "$got" = "$want" ] || { echo "sha256 mismatch for $name: $got != $want" >&2; exit 1; }
                echo "uploaded $name ($(jq -r .size resp.json) bytes) -> $(jq -r .url resp.json)"
                break
              fi
              cat resp.json || true
              [ "$attempt" = 3 ] && exit 1
              sleep 20
            done
          done
          tok="$(token)"
          curl -sS --fail-with-body -o latest.json -X POST -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' \
            --data "{\"version\":\"$VERSION\"}" "$SERVER/v1/releases/publish"
          jq . latest.json

      - name: Verify the public downloads
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SERVER/downloads/latest.json" -o public.json
          [ "$(jq -r .commit public.json)" = "$GITHUB_SHA" ] || { echo "latest.json is not this commit" >&2; exit 1; }
          [ "$(jq '.files | length' public.json)" = 3 ] || { echo "expected 3 files" >&2; exit 1; }
          jq -r '.files[] | [.name, .size, .sha256, .url] | @tsv' public.json | while IFS=$'\t' read -r name size sha url; do
            [ "$(sha256sum "out/$name" | cut -d' ' -f1)" = "$sha" ] || { echo "manifest sha256 differs for $name" >&2; exit 1; }
            len="$(curl -fsSI "$SERVER$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')"
            [ "$len" = "$size" ] || { echo "HEAD $url: length $len != $size" >&2; exit 1; }
            echo "OK $SERVER$url ($size bytes)"
          done
          {
            echo "### Downloads published"
            echo
            jq -r '"Version \(.version) (\(.id))\n"' public.json
            jq -r '.files[] | "- [\(.name)]('"$SERVER"'\(.url)) \(.size) bytes, sha256 `\(.sha256)`"' public.json
          } >>"$GITHUB_STEP_SUMMARY"

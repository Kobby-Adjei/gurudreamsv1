[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airbridge"
version = "0.2.0"
description = "Send tasks between Claude instances on your own machines over Tailscale."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.35",
    "requests[socks]>=2.32",
    "PySocks>=1.7.1",
    "pydantic>=2.7",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.10,<7", "pyinstaller-hooks-contrib>=2024.8"]

[tool.setuptools]
packages = ["airbridge_app"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
